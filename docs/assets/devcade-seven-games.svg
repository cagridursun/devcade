<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<style>
.bg{fill:#0b100d}.panel{fill:#111814;stroke:#304437;stroke-width:2}.muted{fill:#829187}.fg{fill:#e2eae4}.green{fill:#5bdc8c}.cyan{fill:#64cdf0}.amber{fill:#f5be55}.red{fill:#f56969}.purple{fill:#b987f5}.line{stroke:#4b7459;stroke-width:2;fill:none}.txt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-size:14px}.m{font-size:20px;font-weight:700}.big{font-size:28px;font-weight:700}.scene{opacity:0}
