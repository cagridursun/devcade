name: Project website

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/pages/**', 'tools/showcase/**', 'docs/screenshots/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'tools/pages/**', 'docs/screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour. GitHub schedules can still be delayed.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: project-website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate scores, fallback behavior and bilingual content
        run: |
          node --check site/app.mjs
          node --test tools/pages/*.test.mjs
      - name: Build validation copy without external services
        if: github.event_name == 'pull_request'
        run: node tools/pages/build.mjs --offline
      - name: Build site and read public community scores
        if: github.event_name != 'pull_request'
        run: node tools/pages/build.mjs
      - name: Generate real gameplay showcase
        run: go run ./tools/showcase
      - name: Upload gameplay showcase
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: devcade-gameplay-showcase
          path: dist/showcase/devcade-seven-games.svg
          retention-days: 1
      - name: Upload reviewed website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish project website
        id: deployment
        uses: actions/deploy-pages@v5
