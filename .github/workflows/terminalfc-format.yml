name: Terminal FC format

on:
  push:
    branches: [feat/terminal-fc]

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/terminal-fc
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Format Terminal FC changes
        run: |
          gofmt -w internal/games/terminalfc/terminalfc.go internal/engine/game.go internal/terminal/input.go internal/profile/profile.go internal/arcade/catalog.go cmd/devcade/main.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/games/terminalfc/terminalfc.go internal/engine/game.go internal/terminal/input.go internal/profile/profile.go internal/arcade/catalog.go cmd/devcade/main.go
          git commit -m "chore(terminalfc): gofmt implementation"
          git push origin HEAD:feat/terminal-fc
