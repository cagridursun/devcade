name: Terminal FC diagnostic

on:
  push:
    branches: [feat/terminal-fc]

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/terminal-fc
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Format and diagnose tests
        shell: bash
        run: |
          gofmt -w $(git ls-files '*.go')
          set +e
          go test -timeout 60s ./... > terminalfc-test-failure.txt 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            rm -f terminalfc-test-failure.txt
          fi
          if git diff --quiet && [ ! -f terminalfc-test-failure.txt ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.go' terminalfc-test-failure.txt
          git commit -m "chore(terminalfc): capture test diagnostic"
          git push origin HEAD:feat/terminal-fc
          exit "$code"
