name: Generate gameplay showcase

on:
  push:
    branches: [main, fix/real-gameplay-showcase, experiment/arcade-visual-system]
    paths:
      - 'tools/showcase/**'
      - '.github/workflows/showcase.yml'
      - 'internal/engine/**'
      - 'internal/games/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Show Space Shooter gofmt diff
        run: gofmt -d internal/games/spaceshooter/spaceshooter.go || true
      - name: Generate showcase from real game renderers
        run: go run ./tools/showcase
      - name: Upload generated showcase
        uses: actions/upload-artifact@v6
        with:
          name: devcade-gameplay-showcase
          path: dist/showcase/devcade-seven-games.svg
