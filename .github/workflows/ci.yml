name: Cross-platform core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      # Initial scaffold has no generated go.sum: generate/commit it locally
      # before declaring M0/M1 complete. This permits draft CI validation.
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race -timeout 60s ./...
      - run: go build ./...
      - run: go run ./cmd/devcade --version

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target-os: [darwin, linux, windows]
        target-arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go mod tidy
      - run: go build ./cmd/devcade
        env:
          GOOS: ${{ matrix.target-os }}
          GOARCH: ${{ matrix.target-arch }}
          CGO_ENABLED: '0'
