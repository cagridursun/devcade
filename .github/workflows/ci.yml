name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  # Never let a build or test silently edit go.mod/go.sum.
  GOFLAGS: -mod=readonly

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on Windows: one POSIX script for all three runners.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download and verify locked modules
        run: |
          go mod download
          go mod verify

      - name: go.mod and go.sum are tidy
        # -diff prints the needed change and fails without editing files.
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -timeout 60s ./...

      - name: Race tests
        # The race detector needs cgo and a C toolchain; all three hosted
        # runners provide one. Release builds stay CGO_ENABLED=0.
        env:
          CGO_ENABLED: '1'
        run: go test -race -timeout 120s ./...

      - name: Build
        run: go build -o bin/devcade ./cmd/devcade

      - name: Non-TTY smoke tests
        run: |
          bin/devcade --version
          bin/devcade --help
          # Read the full output so pipefail cannot report a producer SIGPIPE.
          for id in snake blockdrop mazechase blastgrid brickbreaker spaceshooter; do
            bin/devcade list | grep "^$id .*Available" >/dev/null || { echo "$id not listed as available"; exit 1; }
          done
          expect() { # expect <status> <args...>
            want=$1; shift
            set +e; bin/devcade "$@" </dev/null >/dev/null; code=$?; set -e
            [ "$code" -eq "$want" ] || { echo "devcade $* exited $code, want $want"; exit 1; }
          }
          expect 2 not-a-command
          for id in snake blockdrop mazechase blastgrid brickbreaker spaceshooter; do
            expect 1 "$id"  # playable: needs a terminal
          done
          expect 2 --diagnostic snake
          expect 1          # menu needs a terminal
          expect 1 --diagnostic
          echo "smoke tests passed"

      - name: Release builder dry run
        # Builds all six archives with the release tooling and verifies the
        # checksums; nothing is uploaded or published.
        if: runner.os == 'Linux'
        run: |
          go run ./tools/release -version 0.0.0-ci.1 -out dist/release
          (cd dist/release && sha256sum -c SHA256SUMS)

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build without cgo
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          go build -trimpath -o "dist/devcade-$GOOS-$GOARCH$ext" ./cmd/devcade
          ls -l dist
