services:
  leaderboard:
    build:
      context: ../..
      dockerfile: packaging/leaderboard/Dockerfile
    restart: unless-stopped
    environment:
      DEVCADE_ADMIN_PASSWORD: ${DEVCADE_ADMIN_PASSWORD:-}
      DEVCADE_SITE_ORIGIN: ${DEVCADE_SITE_ORIGIN:-https://cagridursun.github.io}
    command: ["-listen", "0.0.0.0:8080", "-data", "/data/leaderboard.json", "-trusted-proxy", "172.31.100.2/32"]
    networks:
      default:
        ipv4_address: 172.31.100.3
    volumes:
      - scores:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.31.100.2
    environment:
      LEADERBOARD_HOST: ${LEADERBOARD_HOST:?Set the DNS hostname pointing to this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      leaderboard:
        condition: service_healthy
volumes:
  scores:
  caddy_data:
  caddy_config:
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.100.0/24
