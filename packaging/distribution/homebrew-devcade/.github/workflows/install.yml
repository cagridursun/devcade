name: Homebrew install
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Select Homebrew
        shell: bash
        run: |
          if ! command -v brew >/dev/null; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Install released binary through this tap
        shell: bash
        run: |
          brew tap cagridursun/devcade "$GITHUB_WORKSPACE"
          brew install cagridursun/devcade/devcade
          devcade --version
          for id in snake blockdrop mazechase blastgrid; do
            devcade list | grep -q "^$id .*Available"
          done
          test -f "$(brew --prefix devcade)/share/devcade/LICENSE-NOTICE.txt"
          brew test cagridursun/devcade/devcade
          brew uninstall devcade
